<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Assignments | CampusHub</title>

    <style>

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: Arial, Helvetica, sans-serif;
            background: #090914;
            color: white;
            min-height: 100vh;
        }

        /* TOP BAR */

        .topbar {
            height: 72px;
            padding: 0 35px;

            display: flex;
            align-items: center;
            justify-content: space-between;

            background: #0d0d1b;
            border-bottom: 1px solid rgba(255,255,255,0.08);
        }

        .logo {
            display: flex;
            align-items: center;
            gap: 12px;

            font-size: 20px;
            font-weight: bold;
        }

        .logo-box {
            width: 36px;
            height: 36px;

            display: flex;
            align-items: center;
            justify-content: center;

            border-radius: 10px;

            background: linear-gradient(
                135deg,
                #6d5dfc,
                #a855f7
            );
        }

        .profile {
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .avatar {
            width: 40px;
            height: 40px;

            border-radius: 50%;

            display: flex;
            align-items: center;
            justify-content: center;

            background: linear-gradient(
                135deg,
                #8b5cf6,
                #60a5fa
            );

            font-weight: bold;
        }

        /* LAYOUT */

        .layout {
            display: flex;
            min-height: calc(100vh - 72px);
        }

        /* SIDEBAR */

        .sidebar {
            width: 230px;
            padding: 30px 18px;

            background: #0d0d1b;

            border-right: 1px solid rgba(255,255,255,0.08);
        }

        .sidebar a {
            display: block;

            padding: 14px 16px;
            margin-bottom: 8px;

            border-radius: 12px;

            text-decoration: none;

            color: #aaa9bd;

            transition: 0.2s;
        }

        .sidebar a:hover {
            color: white;
            background: rgba(139,92,246,0.15);
        }

        .sidebar a.active {
            color: white;

            background: linear-gradient(
                135deg,
                rgba(109,93,252,0.8),
                rgba(168,85,247,0.55)
            );
        }

        /* MAIN */

        .main {
            flex: 1;
            padding: 45px;

            background:
                radial-gradient(
                    circle at top right,
                    rgba(91,33,182,0.35),
                    transparent 35%
                );
        }

        .page-label {
            color: #a78bfa;

            font-size: 13px;
            font-weight: bold;

            letter-spacing: 1px;
            text-transform: uppercase;

            margin-bottom: 12px;
        }

        h1 {
            font-size: 42px;
            margin-bottom: 10px;
        }

        .subtitle {
            color: #aaa9bd;
            margin-bottom: 35px;
        }

        /* STATS */

        .stats {
            display: grid;

            grid-template-columns:
                repeat(3, 1fr);

            gap: 18px;

            margin-bottom: 30px;
        }

        .stat-card {
            padding: 22px;

            border-radius: 18px;

            background: rgba(255,255,255,0.06);

            border: 1px solid rgba(255,255,255,0.1);
        }

        .stat-card span {
            color: #aaa9bd;
            font-size: 13px;
        }

        .stat-card h2 {
            margin-top: 8px;
            font-size: 30px;
        }

        /* ASSIGNMENTS */

        .assignment-container {
            background: rgba(255,255,255,0.06);

            border: 1px solid rgba(255,255,255,0.1);

            border-radius: 22px;

            overflow: hidden;
        }

        .assignment-header {
            padding: 22px 25px;

            display: flex;
            justify-content: space-between;
            align-items: center;

            border-bottom: 1px solid rgba(255,255,255,0.08);
        }

        .assignment-header h2 {
            font-size: 20px;
        }

        .assignment {
            display: grid;

            grid-template-columns:
                1fr 160px 120px 130px;

            align-items: center;

            gap: 20px;

            padding: 22px 25px;

            border-bottom: 1px solid rgba(255,255,255,0.07);
        }

        .assignment:last-child {
            border-bottom: none;
        }

        .assignment-title {
            font-size: 16px;
            font-weight: bold;

            margin-bottom: 6px;
        }

        .subject {
            color: #aaa9bd;
            font-size: 13px;
        }

        .due {
            color: #c4b5fd;
            font-size: 14px;
        }

        /* BADGES */

        .badge {
            display: inline-block;

            padding: 6px 12px;

            border-radius: 20px;

            font-size: 12px;
            font-weight: bold;

            text-align: center;
        }

        .high {
            background: rgba(239,68,68,0.18);
            color: #fca5a5;
        }

        .medium {
            background: rgba(234,179,8,0.18);
            color: #fde047;
        }

        .low {
            background: rgba(34,197,94,0.18);
            color: #86efac;
        }

        /* BUTTON */

        .complete-btn {
            border: none;

            padding: 9px 14px;

            border-radius: 10px;

            background: rgba(139,92,246,0.18);

            color: #c4b5fd;

            cursor: pointer;

            font-weight: bold;

            transition: 0.2s;
        }

        .complete-btn:hover {
            background: #8b5cf6;
            color: white;
        }

        .complete-btn:disabled {
            background: #22c55e;
            color: white;
            cursor: not-allowed;
            opacity: 0.75;
        }

        .complete-btn:disabled:hover {
            background: #22c55e;
            color: white;
        }

        .completed {
            opacity: 0.5;
        }

        .completed .assignment-title {
            text-decoration: line-through;
        }

        /* RESPONSIVE */

        @media (max-width: 900px) {

            .stats {
                grid-template-columns: 1fr;
            }

            .assignment {
                grid-template-columns: 1fr;
                gap: 10px;
            }

            .main {
                padding: 25px 18px;
            }

            h1 {
                font-size: 32px;
            }
        }

    </style>
</head>


<body>

    <!-- TOP BAR -->

    <header class="topbar">

        <div class="logo">

            <div class="logo-box">
                C
            </div>

            CampusHub

        </div>


        <div class="profile">

            <div class="avatar">
                H
            </div>

            <div>

                <strong>Himanshu</strong>

                <small style="display:block;color:#aaa9bd;">
                    Student
                </small>

            </div>

        </div>

    </header>


    <div class="layout">


        <!-- SIDEBAR -->

        <aside class="sidebar">

            <a href="dashboard.html">
                ● Dashboard
            </a>

            <a href="schedule.html">
                ▣ Schedule
            </a>

            <a href="assignments.html" class="active">
                ✓ Assignments
            </a>

            <a href="#">
                ⚑ Events
            </a>

            <a href="#">
                ◉ Resources
            </a>

            <a href="#">
                ✦ AI Assistant
            </a>

        </aside>


        <!-- MAIN -->

        <main class="main">

            <div class="page-label">
                Academic Planner
            </div>


            <h1>
                Assignments 📚
            </h1>


            <p class="subtitle">
                Stay ahead of your deadlines and never miss an assignment.
            </p>


            <!-- STATS -->

            <div class="stats">

                <div class="stat-card">

                    <span>
                        Total Assignments
                    </span>

                    <h2 id="totalCount">
                        07
                    </h2>

                </div>


                <div class="stat-card">

                    <span>
                        Pending
                    </span>

                    <h2 id="pendingCount">
                        05
                    </h2>

                </div>


                <div class="stat-card">

                    <span>
                        Completed
                    </span>

                    <h2 id="completedCount">
                        02
                    </h2>

                </div>

            </div>


            <!-- ASSIGNMENT LIST -->

            <section class="assignment-container">


                <div class="assignment-header">

                    <h2>
                        Your Assignments
                    </h2>

                    <span style="color:#aaa9bd;">
                        This Week
                    </span>

                </div>


               <div id="assignments-list"></div>


            </section>

        </main>

    </div>


    <!-- JAVASCRIPT -->

    <script>
        const API_URL = "http://localhost:5001/api/assignments";

        const assignmentsList =
            document.getElementById("assignments-list");

        const totalCount =
            document.getElementById("totalCount");

        const pendingCount =
            document.getElementById("pendingCount");

        const completedCount =
            document.getElementById("completedCount");

        let assignmentsState = [];


        function formatCount(count) {
            return String(count).padStart(2, "0");
        }


        function updateStats(assignments) {
            const completed =
                assignments.filter(assignment => assignment.completed).length;

            totalCount.textContent =
                formatCount(assignments.length);

            pendingCount.textContent =
                formatCount(assignments.length - completed);

            completedCount.textContent =
                formatCount(completed);
        }


        function createTextElement(className, text) {
            const element =
                document.createElement("div");

            element.className = className;
            element.textContent = text;

            return element;
        }


        function renderAssignments(assignments) {
            assignmentsList.innerHTML = "";

            assignments.forEach(assignment => {
                const card =
                    document.createElement("div");

                card.className =
                    assignment.completed ? "assignment completed" : "assignment";

                const details =
                    document.createElement("div");

                details.appendChild(
                    createTextElement("assignment-title", assignment.title)
                );

                details.appendChild(
                    createTextElement("subject", assignment.subject)
                );

                const due =
                    createTextElement("due", assignment.due);

                const priorityWrapper =
                    document.createElement("div");

                const priorityBadge =
                    document.createElement("span");

                priorityBadge.className =
                    `badge ${assignment.priority.toLowerCase()}`;

                priorityBadge.textContent =
                    assignment.priority;

                priorityWrapper.appendChild(priorityBadge);

                const button =
                    document.createElement("button");

                button.className = "complete-btn";
                button.dataset.id = assignment.id;
                button.textContent =
                    assignment.completed ? "Completed" : "Complete";
                button.disabled = assignment.completed;

                card.appendChild(details);
                card.appendChild(due);
                card.appendChild(priorityWrapper);
                card.appendChild(button);

                assignmentsList.appendChild(card);
            });
        }


        async function loadAssignments() {
            try {
                const response =
                    await fetch(API_URL);

                if (!response.ok) {
                    throw new Error("Failed to load assignments");
                }

                assignmentsState =
                    await response.json();

                renderAssignments(assignmentsState);
                updateStats(assignmentsState);
            } catch (error) {
                console.error("Error loading assignments:", error);
                assignmentsList.innerHTML =
                    "<p style=\"padding:22px 25px;color:#fca5a5;\">Could not load assignments.</p>";
            }
        }


        async function completeAssignment(id, button) {
            const originalText =
                button.textContent;

            button.disabled = true;
            button.textContent = "Saving...";

            try {
                const response =
                    await fetch(`${API_URL}/${id}`, {
                        method: "PATCH",
                        headers: {
                            "Content-Type": "application/json"
                        }
                    });

                const data =
                    await response.json();

                if (!response.ok) {
                    throw new Error(data.message || "Failed to complete assignment");
                }

                assignmentsState =
                    assignmentsState.map(assignment => {
                        if (assignment.id !== id) {
                            return assignment;
                        }

                        return data.assignment || {
                            ...assignment,
                            completed: true
                        };
                    });

                renderAssignments(assignmentsState);
                updateStats(assignmentsState);
            } catch (error) {
                console.error("Error completing assignment:", error);

                button.disabled = false;
                button.textContent = originalText;

                alert("Could not complete assignment.");
            }
        }


        assignmentsList.addEventListener("click", event => {
            const button =
                event.target.closest(".complete-btn");

            if (!button || button.disabled) {
                return;
            }

            completeAssignment(Number(button.dataset.id), button);
        });


        loadAssignments();
    </script>
</body>

</html>
